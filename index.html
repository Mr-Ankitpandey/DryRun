<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DryRun — stop watching algorithms, start tracing them. Predict each step, see where your mental model broke, re-trace on fresh inputs." />
    <meta name="color-scheme" content="light dark" />
    <title>DryRun</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('dryrun.v1') || 'null');
        var t = s && s.settings && s.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
